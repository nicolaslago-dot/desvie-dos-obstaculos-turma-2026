<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo | Corrida do Circuito</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body class="pagina-jogo">
  <main class="jogo">
    <canvas id="tela-jogo" aria-label="Corrida em três pistas"></canvas>

    <header class="painel">
      <span class="marca">CORRIDA DO CIRCUITO</span>
      <div class="placar">
        <p>PONTOS <strong id="pontos">000000</strong></p>
        <p>DISTÂNCIA <strong><span id="distancia">0</span> m</strong></p>
        <p>NÍVEL <strong id="nivel">01</strong></p>
      </div>
      <div class="acoes-jogo">
        <button id="botao-som" type="button" aria-pressed="true">Silenciar</button>
        <button id="botao-camera" type="button" aria-pressed="false">Ativar câmera</button>
        <button id="botao-pausa" type="button">Pausar</button>
      </div>
    </header>

    <aside class="painel-coleta" aria-label="Peças do robô e vidas">
      <div class="resumo-coleta">
        <span>ROBÔ <strong id="total-pecas">0/6</strong></span>
        <span>VIDAS <strong id="vidas">1</strong></span>
      </div>
      <div id="pecas-robo" class="pecas-robo" role="group" aria-label="Partes coletadas"></div>
    </aside>
    <p id="aviso-coleta" class="aviso-coleta" role="status" aria-live="polite" hidden></p>

    <p class="ajuda">← → MUDAR DE PISTA · ↑ OU ESPAÇO PARA PULAR · P PARA PAUSAR</p>
    <div id="painel-contagem" class="contagem" hidden role="status" aria-live="polite" aria-atomic="true">
      <span>PREPARE-SE</span>
      <strong id="numero-contagem">3</strong>
    </div>

    <section id="painel-pausa" class="pausa" hidden>
      <div class="caixa-pausa">
        <h1>PAUSADO</h1>
        <p>A corrida espera por você.</p>
        <button class="botao-principal" id="botao-continuar" type="button">CONTINUAR</button>
        <a href="index.html">VOLTAR AO MENU</a>
      </div>
    </section>
    <aside class="camera" aria-label="Controle pelo corpo e pelos braços" hidden>
      <button id="botao-centralizar" type="button" hidden>Centralizar corpo</button>
      <div id="previa-camera" class="previa-camera" hidden>
        <video id="video-camera" autoplay muted playsinline hidden aria-label="Sua câmera espelhada"></video>
        <canvas id="esqueleto-camera" aria-hidden="true"></canvas>
      </div>
      <p id="status-camera" role="status" aria-live="polite"></p>
    </aside>
    <div id="efeito-colisao" class="efeito-colisao" aria-hidden="true"></div>
  </main>

  <script defer src="js/01-estado.js"></script>
  <script defer src="js/02-movimento.js"></script>
  <script defer src="js/03-obstaculos.js"></script>
  <script defer src="js/04-colisoes.js"></script>
  <script defer src="js/05-pontos.js"></script>
  <script defer src="js/06-desenho.js"></script>
  <script defer src="js/07-controles.js"></script>
  <script defer src="js/sistemas/camera.js"></script>
  <script defer src="js/sistemas/audio.js"></script>
  <script defer src="js/sistemas/dificuldade.js"></script>
  <script defer src="js/sistemas/coleta.js"></script>
  <script defer src="js/08-jogo.js"></script>
</body>
</html>
